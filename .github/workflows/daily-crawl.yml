name: Daily crawl

on:
  schedule:
    - cron: "0 22 * * *" # 05:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/crawler
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear annotation instead of a crawler error at the end of the job.
      - name: Check DATABASE_URL secret
        id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing DATABASE_URL secret::Set the repository secret DATABASE_URL (Settings > Secrets and variables > Actions); the crawl cannot store jobs without it."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Crawl
        run: uv run python -m job_crawler --profiles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      # Re-apply derived columns (remote region, countries, time zones, tech, salary) to jobs that
      # were not re-crawled today, so rule changes reach old rows too. Only changed rows are written.
      - name: Recompute derived columns
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        run: uv run python -m job_crawler --recompute-derived
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
