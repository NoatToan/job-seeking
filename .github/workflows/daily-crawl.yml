name: Daily crawl

on:
  schedule:
    - cron: "0 22 * * *" # 05:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/crawler
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Crawl
        run: uv run python -m job_crawler --profiles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      # Re-apply derived columns (remote region, countries, time zones, tech, salary) to jobs that
      # were not re-crawled today, so rule changes reach old rows too. Only changed rows are written.
      # It then re-parses description sections + level on rows written by older rules
      # (jobs.sections_version < job_crawler.sections.VERSION), in committed batches.
      - name: Recompute derived columns, backfill sections and level
        if: ${{ !cancelled() }}
        run: uv run python -m job_crawler --recompute-derived
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Job votes: decay old reports, count accounts that came of age, reset jobs the board reposted
  # (ujc_api.job_votes). After the crawl, which is what moves `posted_at`.
  job-votes:
    needs: crawl
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync
      - name: Refresh job vote stats
        run: uv run python -m ujc_api.maintenance refresh-votes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Rebuild the site so the static job pages and sitemaps (scripts/seo-snapshot.mjs) follow today's
  # crawl: new jobs get a page, jobs no longer listed drop out (404). Runs even when the crawl job
  # failed part-way (whatever it stored is still valid); vercel-rebuild.yml skips with a notice when
  # no deploy credential is configured.
  rebuild:
    needs: crawl
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/vercel-rebuild.yml
    secrets: inherit
