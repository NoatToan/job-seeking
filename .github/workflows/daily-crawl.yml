name: Daily crawl

on:
  schedule:
    - cron: "0 22 * * *" # 05:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/crawler
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Crawl
        run: uv run python -m job_crawler --profiles
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

      # Re-apply derived columns (remote region, countries, time zones, tech, salary) to jobs that
      # were not re-crawled today, so rule changes reach old rows too. Only changed rows are written.
      - name: Recompute derived columns
        if: ${{ !cancelled() }}
        run: uv run python -m job_crawler --recompute-derived
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Rebuild the site so the static job pages and sitemaps (scripts/seo-snapshot.mjs) follow
      # today's crawl: new jobs get a page, jobs no longer listed drop out (404). Needs the
      # repository secret VERCEL_DEPLOY_HOOK_URL (a Vercel Deploy Hook on `main`); skipped without it.
      - name: Rebuild static job pages
        if: ${{ !cancelled() }}
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set; skipping the rebuild"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Deploy hook triggered"
