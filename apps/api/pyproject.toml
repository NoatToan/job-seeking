[project]
name = "ujc_api"
version = "0.1.0"
description = "Unified Job Crawler API: FastAPI backend (apps/api)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "job_crawler",
    "job_search_mcp",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv.sources]
job_crawler = { path = "../crawler", editable = true }
job_search_mcp = { path = "../mcp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ujc_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# FastAPI's `Depends(...)` default-argument pattern is idiomatic and recommended by FastAPI
# itself; without this, B008 would flag every route in the app.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body", "fastapi.File"]
